name: HatchwayTrails
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 2
    GENERATE_INFOPLIST_FILE: YES
targets:
  HatchwayTrails:
    type: application
    platform: iOS
    sources: [Source]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.hatchway.trails
        INFOPLIST_KEY_CFBundleDisplayName: Chickososik
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HatchwayTrailsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, Source/Yard.swift]
    dependencies:
      - target: HatchwayTrails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.hatchway.trails.uitests
        TEST_TARGET_NAME: HatchwayTrails
schemes:
  HatchwayTrails:
    build:
      targets:
        HatchwayTrails: all
    test:
      targets:
        - HatchwayTrailsUITests
